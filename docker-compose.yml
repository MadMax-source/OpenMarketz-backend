services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openmarketz_dev
      POSTGRES_PASSWORD: openmarketz_dev
      POSTGRES_DB: openmarketz
    ports:
      - "5432:5432"
    volumes:
      - openmarketz-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmarketz_dev -d openmarketz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  openmarketz-postgres:
